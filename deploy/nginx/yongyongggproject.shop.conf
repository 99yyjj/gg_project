# yongyongggproject.shop — 한 도메인에서 프론트(Next.js)와 백엔드(FastAPI)를 함께 서비스.
#
#   /api/...   → 백엔드(FastAPI, 8000)   ─ 모든 백엔드 API
#   /auth/...  → 백엔드(FastAPI, 8000)   ─ Cafe24 OAuth 전용 (/auth/cafe24/*)
#   그 외      → 프론트(Next.js, 3000)   ─ /shop/[username] 등 모든 페이지
#
# 설치 예시:
#   sudo cp deploy/nginx/yongyongggproject.shop.conf /etc/nginx/sites-available/yongyongggproject.shop
#   sudo ln -s /etc/nginx/sites-available/yongyongggproject.shop /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# HTTPS(인증서)는 certbot --nginx 등으로 별도 설정하세요.

upstream gg_backend {
    server 127.0.0.1:8000;
}

upstream gg_frontend {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    listen [::]:80;
    server_name yongyongggproject.shop;

    client_max_body_size 20M;  # 상품 이미지 업로드 여유

    # 백엔드 API — 전부 /api 아래
    location /api/ {
        proxy_pass http://gg_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cafe24 OAuth 전용 경로 (/auth/cafe24/login, /callback, /exchange)
    # 카페24 개발자센터에 등록된 redirect_uri와 묶여 있어 /api 없이 노출.
    location /auth/ {
        proxy_pass http://gg_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 그 외 모든 요청 → 프론트(Next.js)
    location / {
        proxy_pass http://gg_frontend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js HMR/WebSocket (개발용) 대비
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
